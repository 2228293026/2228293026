name: Metrics

on:
  schedule:
    # 每天 UTC 0 点运行(北京时间早上 8 点),可自行调整
    - cron: "0 0 * * *"
  # 允许手动触发
  workflow_dispatch:
  # push 到 main 时也触发一次
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 左栏:活跃度 + 代码增删行数 + 贡献日历
      - name: Generate Metrics (left)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-left.svg
          output_action: none
          template: classic
          base: header, activity, community
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Shanghai

      # 右栏:语言占比 + 仓库 + star + 开源协议分布
      - name: Generate Metrics (right)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-right.svg
          output_action: none
          template: classic
          base: repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_licenses: yes
          plugin_licenses_legal: no
          config_timezone: Asia/Shanghai

      # 用 SSH 签名提交:署名归本人 + 绿色 Verified 徽章
      - name: Commit and push (SSH signed)
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.METRICS_SIGNING_KEY_B64 }}" | base64 -d > "$HOME/.ssh/signing_key"
          chmod 600 "$HOME/.ssh/signing_key"

          git config user.name "HitMargin"
          git config user.email "2228293026@qq.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/signing_key"
          git config commit.gpgsign true

          # docker 以 root 写入,需要 sudo 取回
          shopt -s nullglob
          for f in /metrics_renders/*.svg; do
            sudo cp -f "$f" .
            sudo chown "$(id -u):$(id -g)" "$(basename "$f")"
          done

          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update metrics [skip ci]"
            git push
          fi
